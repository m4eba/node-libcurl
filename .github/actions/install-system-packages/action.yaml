name: Install System Packages
description: Installs required system packages on macOS and Linux (incl. Alpine)

runs:
  using: composite
  steps:
    - name: Detect alpine
      id: detect-alpine
      shell: bash
      run: |
        if [ -f /etc/alpine-release ]; then
          echo "result=true" >> "$GITHUB_OUTPUT"
        else
          echo "result=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install Needed packages on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # ninja builds curl itself in curl-impersonate's CMake build.
        brew install coreutils wget automake libtool cmake gnu-sed m4 groff make ninja pkg-config

    - name: Install Needed packages on Linux
      if: runner.os == 'Linux' && steps.detect-alpine.outputs.result == 'false'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y cmake ninja-build patch groff libtsan0

    - name: Install Needed packages on Alpine
      if: steps.detect-alpine.outputs.result == 'true'
      shell: sh
      run: |
        # ninja builds curl itself, patch applies curl-impersonate's dependency
        # patches, and bzip2/xz/unzip unpack the dependency archives
        apk --no-cache add --virtual .rundeps \
        ninja patch bzip2 xz unzip \
        bash ca-certificates cmake curl docker git \
        gnupg openssh-client openssl parallel pkgconfig \
        coreutils \
        python3 py3-pip make g++ \
        perl linux-headers \
        autoconf automake libtool \
        texinfo flex bison build-base libedit-dev mandoc-soelim zlib zlib-dev zlib-static
